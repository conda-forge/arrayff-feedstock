context:
  version: "0.0.2"
  python_min: "3.12"

package:
  name: arrayff
  version: ${{ version }}

source:
  url: https://github.com/LiuGaoyong/ArrayFF/releases/download/v${{ version }}/arrayff-${{ version }}.tar.gz
  sha256: bb2e8a969694e3c5cd6c7ddd03ff97b692174787b7e368beb6e7ad2048e61dc8

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build
  run:
    - python >=${{ python_min }}
    - ase >=3.20
    - autograd >=1.6
    - autoray >=0.1
    - numpy >=2.0
    - scipy >=1.10
    - scikit-learn >=1.5

tests:
  - python:
      imports:
        - arrayff
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/LiuGaoyong/ArrayFF
  summary: The Force Field Library Based on Multiple Array Backends like NumPy, PyTorch, JAX.
  description: |
    The Force Field Library Based on Multiple Array Backends like NumPy, PyTorch, JAX.
  license: GPL-3.0-or-later
  license_file: src/LICENSE
  repository: https://github.com/LiuGaoyong/ArrayFF

extra:
  recipe-maintainers:
    - LiuGaoyong
